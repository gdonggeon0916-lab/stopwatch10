<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고등학생을 위한 Smart 집중 스톱워치</title>
    <!-- Google Fonts import (Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* [CSS 영역] 웹앱 디자인 및 스타일 정의 */
        :root {
            --primary: #4F46E5;       /* 메인 인디고 컬러 */
            --primary-hover: #4338CA;
            --secondary: #10B981;     /* 하이라이트 에메랄드 컬러 */
            --bg-color: #F3F4F6;      /* 배경 연회색 */
            --card-bg: #FFFFFF;       /* 카드 흰색 */
            --text-main: #1F2937;     /* 기본 텍스트 */
            --text-sub: #6B7280;      /* 서브 텍스트 */
            --border: #E5E7EB;        /* 테두리 색상 */
            --danger: #EF4444;        /* 경고/에러 색상 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans KR', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 1. 상단 타이틀 섹션 */
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 0.9rem;
            color: var(--text-sub);
        }

        /* 2. 핵심 수칙 3가지 카드 */
        .rules-card {
            background-color: #EEF2FF;
            border: 1px solid #C7D2FE;
            border-radius: 12px;
            padding: 16px;
        }
        .rules-card h3 {
            font-size: 0.95rem;
            color: var(--primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .rules-list {
            list-style: none;
            font-size: 0.85rem;
            color: #374151;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .rules-list li {
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .rules-list li span {
            font-weight: bold;
            color: var(--primary);
        }

        /* 3. 입력 폼 영역 */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-main);
        }
        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border-color: var(--primary);
        }
        /* 에러 메시지 */
        .error-msg {
            font-size: 0.8rem;
            color: var(--danger);
            display: none; /* JS로 동적 제어 */
        }

        /* 4. 스톱워치 메인 디스플레이 */
        .timer-display {
            text-align: center;
            padding: 20px 0;
            background: #F9FAFB;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .timer-time {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            letter-spacing: -1px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .badge-ready { background: #E5E7EB; color: #4B5563; }
        .badge-running { background: #D1FAE5; color: #065F46; }
        .badge-paused { background: #FEF3C7; color: #92400E; }

        /* 버튼 그룹 */
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #6B7280; color: white; }
        .btn-success { background: var(--secondary); color: white; grid-column: span 2; }

        /* 5. 결과 하이라이트 및 기록 섹션 */
        .records-section {
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .records-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .records-header h3 {
            font-size: 1rem;
            font-weight: 700;
        }
        .clear-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: underline;
        }

        /* 기록 카드 리스트 */
        .record-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        .record-card {
            background: #F9FAFB;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .record-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .record-title {
            font-size: 0.9rem;
            font-weight: 700;
        }
        .record-date {
            font-size: 0.75rem;
            color: var(--text-sub);
        }
        .record-time {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }
        .empty-record {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-sub);
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- [1] 상단 타이틀 섹션 -->
        <header class="header">
            <h1>⏱️ 목표 달성 스톱워치</h1>
            <p>오늘의 공부 및 활동 목표를 세우고 시간을 측정하세요!</p>
        </header>

        <!-- [2] 필수 조건 3가지 안내 섹션 -->
        <section class="rules-card">
            <h3>📋 측정 시 필수 준수 3규칙</h3>
            <ul class="rules-list">
                <li><span>1.</span> 집중 목표(과목/활동)를 먼저 정확히 입력할 것</li>
                <li><span>2.</span> 타이머 작동 중에는 다른 행동(휴대폰 딴짓) 금지</li>
                <li><span>3.</span> 측정이 끝난 후 기록을 꼭 확인하고 저장할 것</li>
            </ul>
        </section>

        <!-- [3] 입력 폼 섹션 -->
        <section class="form-group">
            <label for="goalInput">🎯 측정할 목표 / 과목명</label>
            <input type="text" id="goalInput" class="input-field" placeholder="예: 수학 모의고사 1회 풀기, 영어 단어 암기">
            <span id="errorMsg" class="error-msg">⚠️ 목표를 입력하지 않으면 스톱워치를 시작할 수 없습니다!</span>
        </section>

        <!-- [4] 스톱워치 디스플레이 섹션 -->
        <section class="timer-display">
            <div>
                <span id="statusBadge" class="status-badge badge-ready">대기 중</span>
            </div>
            <div id="timeDisplay" class="timer-time">00:00:00</div>
        </section>

        <!-- [5] 스톱워치 조작 버튼 그룹 -->
        <div class="btn-group">
            <button id="startPauseBtn" class="btn btn-primary">시작</button>
            <button id="resetBtn" class="btn btn-secondary">초기화</button>
            <button id="saveBtn" class="btn btn-success" style="display: none;">🎉 완료 및 기록 저장</button>
        </div>

        <!-- [6] 이전 기록 및 결과 카드 영역 -->
        <section class="records-section">
            <div class="records-header">
                <h3>📊 최근 집중 기록</h3>
                <button id="clearHistoryBtn" class="clear-btn">전체 삭제</button>
            </div>
            <div id="recordList" class="record-list">
                <!-- JavaScript를 통해 동적으로 카드 추가됨 -->
            </div>
        </section>
    </div>

    <script>
        /* [JavaScript 영역] 기능 구현 */

        // --- 1. 상태 변수 선언 ---
        let timerInterval = null;
        let elapsedTime = 0; // 경과 시간 (밀리초 단위)
        let isRunning = false;

        // --- 2. DOM 요소 가져오기 ---
        const goalInput = document.getElementById('goalInput');
        const errorMsg = document.getElementById('errorMsg');
        const statusBadge = document.getElementById('statusBadge');
        const timeDisplay = document.getElementById('timeDisplay');
        const startPauseBtn = document.getElementById('startPauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const saveBtn = document.getElementById('saveBtn');
        const recordList = document.getElementById('recordList');
        const clearHistoryBtn = document.getElementById('clearHistoryBtn');

        // --- 3. 시간 포맷 함수 (밀리초 -> HH:MM:SS 또는 MM:SS.ms) ---
        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (num) => String(num).padStart(2, '0');
            return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
        }

        // --- 4. 스톱워치 시작 / 일시정지 로직 ---
        function toggleTimer() {
            // [유효성 검사] 입력이 비어있는 경우 시작 불가
            const goalText = goalInput.value.trim();
            if (!goalText) {
                errorMsg.style.display = 'block';
                goalInput.focus();
                return;
            }
            errorMsg.style.display = 'none'; // 에러 메시지 숨김

            if (!isRunning) {
                // 시작 처리
                isRunning = true;
                const startTime = Date.now() - elapsedTime;
                
                timerInterval = setInterval(() => {
                    elapsedTime = Date.now() - startTime;
                    timeDisplay.textContent = formatTime(elapsedTime);
                }, 100);

                // UI 업데이트
                startPauseBtn.textContent = '일시정지';
                startPauseBtn.style.backgroundColor = '#F59E0B'; // 주황색 변경
                statusBadge.textContent = '측정 중...';
                statusBadge.className = 'status-badge badge-running';
                goalInput.disabled = true; // 측정 시작 시 입력창 비활성화
                saveBtn.style.display = 'block'; // 저장 버튼 표시
            } else {
                // 일시정지 처리
                isRunning = false;
                clearInterval(timerInterval);

                // UI 업데이트
                startPauseBtn.textContent = '재개';
                startPauseBtn.style.backgroundColor = 'var(--primary)';
                statusBadge.textContent = '일시정지';
                statusBadge.className = 'status-badge badge-paused';
            }
        }

        // --- 5. 스톱워치 초기화 로직 ---
        function resetTimer() {
            clearInterval(timerInterval);
            isRunning = false;
            elapsedTime = 0;

            // UI 초기화
            timeDisplay.textContent = '00:00:00';
            startPauseBtn.textContent = '시작';
            startPauseBtn.style.backgroundColor = 'var(--primary)';
            statusBadge.textContent = '대기 중';
            statusBadge.className = 'status-badge badge-ready';
            goalInput.disabled = false;
            saveBtn.style.display = 'none';
            errorMsg.style.display = 'none';
        }

        // --- 6. 기록 저장 기능 (LocalStorage 활용) ---
        function saveRecord() {
            if (elapsedTime < 1000) {
                alert('최소 1초 이상 측정해야 기록할 수 있습니다.');
                return;
            }

            const record = {
                id: Date.now(),
                title: goalInput.value.trim(),
                time: formatTime(elapsedTime),
                date: new Date().toLocaleDateString('ko-KR', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                })
            };

            // 기존 기록 가져오기 및 추가
            const history = JSON.parse(localStorage.getItem('stopwatchHistory') || '[]');
            history.unshift(record); // 최신 기록을 맨 앞에 추가
            localStorage.setItem('stopwatchHistory', JSON.stringify(history));

            // 리셋 및 기록 화면 갱신
            resetTimer();
            goalInput.value = '';
            renderRecords();
            alert('🎉 기록이 성공적으로 저장되었습니다!');
        }

        // --- 7. 저장된 기록 화면에 출력 ---
        function renderRecords() {
            const history = JSON.parse(localStorage.getItem('stopwatchHistory') || '[]');
            recordList.innerHTML = '';

            if (history.length === 0) {
                recordList.innerHTML = '<div class="empty-record">아직 저장된 기록이 없습니다.</div>';
                return;
            }

            history.forEach(item => {
                const card = document.createElement('div');
                card.className = 'record-card';
                card.innerHTML = `
                    <div class="record-info">
                        <span class="record-title">${escapeHtml(item.title)}</span>
                        <span class="record-date">${item.date}</span>
                    </div>
                    <div class="record-time">${item.time}</div>
                `;
                recordList.appendChild(card);
            });
        }

        // --- 8. 기록 전체 삭제 ---
        function clearHistory() {
            if (confirm('모든 기록을 삭제하시겠습니까?')) {
                localStorage.removeItem('stopwatchHistory');
                renderRecords();
            }
        }

        // XSS 방지를 위한 문자열 이스케이프 함수
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        // --- 9. 이벤트 리스너 등록 ---
        startPauseBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        saveBtn.addEventListener('click', saveRecord);
        clearHistoryBtn.addEventListener('click', clearHistory);

        // 입력 폼에 텍스트 입력 시 에러 메시지 자동 감춤
        goalInput.addEventListener('input', () => {
            if (goalInput.value.trim()) {
                errorMsg.style.display = 'none';
            }
        });

        // 페이지 로드 시 저장된 기록 불러오기
        window.addEventListener('DOMContentLoaded', renderRecords);
    </script>
</body>
</html>
